<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>3008 Survival — Бесконечный магазин</title>
<link rel="stylesheet" href="/style.css">
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
</head>
<body>
<div id="game"></div>
<div id="vignette"></div><canvas id="grain"></canvas><div id="dmgflash"></div>
<div id="hud" class="hidden hud-min">
  <button id="menuBtn" class="iconBtn" data-ic="menu" title="Esc"></button>
  <div id="chat"><div id="chatLog"></div><input id="chatInput" maxlength="160" data-tp="chatPh" placeholder="…" autocomplete="off"></div>
  <div id="topbar"><div id="clock"><span id="clockIc"></span><b id="dayLabel"></b><span id="timeLabel"></span><div id="timeBar"><i></i></div></div><div id="flags"></div></div>
  <div id="plist"></div>
  <div id="party"></div>
  <div id="announce"></div>
  <div id="bigDay"></div>
  <div id="crosshair"></div>
  <div id="prompt"></div>
  <div id="carryInfo"></div>
  <div id="msg"></div>
  <div id="stats">
    <div class="bar hp"><span data-ic="heart"></span><b><i></i></b><em></em></div>
    <div class="bar food"><span data-ic="food"></span><b><i></i></b><em></em></div>
    <div class="bar energy"><span data-ic="bolt"></span><b><i></i></b><em></em></div>
    <div class="bar stam"><span data-ic="run"></span><b><i></i></b><em></em></div>
    <div id="level"><span id="lvNum"></span><div id="xpBar"><i></i></div><small id="daysLabel"></small></div>
  </div>
  <div id="hotbar"></div>
  <div id="tip"></div>
  <div id="feed"></div>
  <div id="toasts"></div>
  <div id="wpList"></div>
  <div id="mapWrap"><div id="zoneName"></div><div id="mapBox"><canvas id="minimap" width="180" height="180"></canvas><div id="compass">N</div></div><div id="coords"></div></div>
  <button id="mapBtn" class="iconBtn" data-ic="map" title="N"></button>
  <div id="fps"></div>
  <div id="hudHint"></div>
</div>
<div id="itTip"></div>
<div id="board" class="panel hidden"><h2 data-t="board"></h2><div class="cols"><div><h3 data-t="online"></h3><table id="onlineT"></table></div><div><h3 data-t="allTime"></h3><table id="topT"></table></div></div></div>
<div id="inv" class="hidden"><div class="box"><button id="invClose" class="x iconBtn" data-ic="x"></button><div id="invBody"></div></div></div>
<div id="achP" class="panel hidden"><h2 id="achTitleH"></h2><div id="achList"></div><button id="achClose" data-t="close"></button></div>
<div id="pause" class="panel hidden"><h2 data-t="paused"></h2>
  <div class="settings"></div>
  <div class="row"><button id="resumeBtn" class="primary" data-t="resume"></button></div>
  <div class="row"><button id="helpBtn" class="ghost" data-t="controls"></button><button id="pAvBtn" class="ghost" data-t="avatarBtn"></button><button id="pAchBtn" class="ghost" data-t="achBtn"></button></div>
</div>
<div id="help" class="panel hidden"><h2 data-t="controls"></h2><div class="keys" id="helpBody"></div><button id="helpClose" data-t="close"></button></div>
<div id="death" class="panel hidden"><div class="deathIc" data-ic="skull"></div><h1 data-t="died"></h1><p id="deathWhy"></p><button id="respawnBtn" data-t="respawn"></button></div>
<div id="menu">
  <div class="menuBox">
    <h1>3008</h1><div class="brand">SURVIVAL</div>
    <p class="sub" data-t="sub"></p>
    <input id="nameInput" maxlength="16" data-tp="name" placeholder="…">
    <button id="playBtn" class="primary" data-t="play"></button>
    <div class="row menuRow"><button id="avatarBtn" class="ghost"><span data-ic="user"></span><span data-t="avatarBtn"></span></button><button id="achBtn" class="ghost"><span data-ic="trophy"></span><span data-t="achBtn"></span></button><button id="setBtn" class="ghost"><span data-ic="gear"></span><span data-t="settingsT"></span></button></div>
    <div class="settings collapsed" id="menuSettings"></div>
    <p class="hint" data-t="hint"></p>
    <p class="ver" id="ver"></p>
  </div>
</div>
<div id="keysHint" class="hidden"></div>
<div id="rotateHint" class="hidden"><div><b data-t="rotatePhone"></b><p data-t="rotatePhoneH"></p></div></div>
<div id="touch" class="hidden">
  <div id="joyZone"><div id="joy" class="hidden"><i></i></div></div>
  <div id="lookZone"></div>
  <div id="tbtns">
    <button data-k="attack" data-ic="hammer" class="tb big"></button>
    <button data-k="use" class="tb">E</button>
    <button data-k="jump" class="tb">↑</button>
    <button data-k="sprint" data-ic="run" class="tb"></button>
    <button data-k="place" data-ic="box" class="tb"></button>
    <button data-k="eat" data-ic="food" class="tb"></button>
    <button data-k="inv" data-ic="bag" class="tb"></button>
    <button data-k="craft" data-ic="craft" class="tb"></button>
    <button data-k="chat" data-ic="chat" class="tb sm"></button>
    <button data-k="menu" data-ic="menu" class="tb sm"></button>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3008 Survival — Бесконечный магазин</title>
<link rel="stylesheet" href="/style.css">
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
</head>
<body>
<div id="game"></div>
<div id="vignette"></div><canvas id="grain"></canvas><div id="dmgflash"></div>
<div id="hud" class="hidden">
  <button id="menuBtn" title="Menu (M / Esc)">☰</button>
  <div id="plist"></div>
  <div id="wpList"></div>
  <div id="topbar"><div id="clock"><b id="dayLabel">Day 1</b><span id="timeLabel">09:00</span><div id="timeBar"><i></i></div></div></div>
  <div id="stats">
    <div class="bar hp"><span>❤</span><i></i><em></em></div>
    <div class="bar food"><span>🍖</span><i></i><em></em></div>
    <div class="bar energy"><span>⚡</span><i></i><em></em></div>
    <div class="bar stam"><span>🏃</span><i></i><em></em></div>
  </div>
  <div id="level"><b id="lvNum">Lv 1</b><div id="xpBar"><i></i></div><small id="daysLabel">0 nights survived · 0 KOs</small></div>
  <div id="mapWrap"><canvas id="minimap" width="180" height="180"></canvas><div id="compass">N</div><div id="coords"></div><div id="zoneName"></div></div>
  <div id="feed"></div>
  <div id="announce"></div>
  <div id="bigDay"></div>
  <div id="crosshair"></div>
  <div id="prompt"></div>
  <div id="carryInfo"></div>
  <div id="hotbar"></div>
  <div id="msg"></div>
  <div id="tip"></div>
  <div id="chat"><div id="chatLog"></div><input id="chatInput" maxlength="160" data-tp="chatPh" placeholder="…" autocomplete="off"></div>
  <div id="party"></div>
  <div id="flags"></div>
  <div id="toasts"></div>
  <div id="fps"></div>
</div>
<div id="itTip"></div>
<div id="board" class="panel hidden"><h2 data-t="board"></h2><div class="cols"><div><h3 data-t="online"></h3><table id="onlineT"></table></div><div><h3 data-t="allTime"></h3><table id="topT"></table></div></div></div>
<div id="inv" class="hidden"><div class="box"><button id="invClose" class="x">✕</button><div id="invBody"></div></div></div>
<div id="achP" class="panel hidden"><h2 id="achTitleH"></h2><div id="achList"></div><button id="achClose" data-t="close"></button></div>
<div id="pause" class="panel hidden"><h2 data-t="paused"></h2>
  <div class="settings"></div>
  <div class="row"><button id="resumeBtn" data-t="resume"></button><button id="helpBtn" data-t="controls"></button></div>
  <div class="row"><button id="pAvBtn" data-t="avatarBtn"></button><button id="pAchBtn" data-t="achBtn"></button></div>
</div>
<div id="help" class="panel hidden"><h2 data-t="controls"></h2><div class="keys" id="helpBody"></div><button id="helpClose" data-t="close"></button></div>
<div id="death" class="panel hidden"><h1 data-t="died"></h1><p id="deathWhy"></p><button id="respawnBtn" data-t="respawn"></button></div>
<div id="menu">
  <div class="menuBox">
    <h1>3008<span>SURVIVAL</span></h1>
    <p class="sub" data-t="sub"></p>
    <input id="nameInput" maxlength="16" data-tp="name" placeholder="…">
    <button id="playBtn" data-t="play"></button>
    <div class="row menuRow"><button id="avatarBtn" data-t="avatarBtn"></button><button id="achBtn" data-t="achBtn"></button></div>
    <div class="settings"></div>
    <p class="hint" data-t="hint"></p>
    <p class="ver" id="ver"></p>
  </div>
</div>
<div id="touch" class="hidden">
  <div id="joy"><i></i></div>
  <div id="tbtns"><button data-k="jump">⤒</button><button data-k="attack">✊</button><button data-k="use">E</button><button data-k="place">▣</button><button data-k="eat">🍴</button><button data-k="sprint">🏃</button><button data-k="sleep">💤</button><button data-k="craft">🎒</button></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/main.js"></script>
</body>
</html>
